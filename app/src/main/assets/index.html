<title>Чусовая</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0e12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;1,400&family=Onest:wght@400;500&display=swap">
<style>
/* Layout: приложение во весь экран — живой кадр реки, сверху время и пора, снизу пульт: звук, время, сезон */
:root{
  --ink:#0b0e12;
  --glass:rgba(12,15,24,.42);
  --fg:#f6f1e7;
  --muted:rgba(246,241,231,.74);
  --edge:rgba(246,241,231,.24);
  --accent:#f3c47e;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--ink)}
body{background:var(--ink);color:var(--fg);font-family:var(--f-ui);font-size:15px;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.app{position:relative;height:100%;min-height:420px;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scrim-top{position:absolute;left:0;right:0;top:0;height:140px;background:linear-gradient(rgba(0,0,0,.22),transparent);pointer-events:none}
.hud{
  position:absolute;top:0;left:0;right:0;pointer-events:none;
  padding-top:14px;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  text-shadow:0 1px 14px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
}
.place{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.clock{font-family:var(--f-display);font-size:clamp(48px,11vw,84px);line-height:.95;font-variant-numeric:tabular-nums;margin-top:2px}
.sub{font-family:var(--f-display);font-style:italic;font-size:clamp(16px,3.6vw,20px);margin-top:4px;max-width:26ch;text-wrap:balance}
.holiday{display:inline-block;margin-top:8px;font-size:12px;letter-spacing:.08em;padding:3px 10px;border-radius:999px;background:rgba(243,196,126,.92);color:#2a1b08;text-shadow:none}
.holiday[hidden]{display:none}
.badge{font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap;margin-top:4px}
.badge.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#e8644f;margin-right:7px;vertical-align:1px}
.toast{
  position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);pointer-events:none;
  font-family:var(--f-display);font-style:italic;font-size:clamp(18px,4.4vw,24px);color:#fff;white-space:nowrap;
  text-shadow:0 1px 18px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);opacity:0;transition:opacity 1.2s;
}
.toast.show{opacity:1}
.dock{
  position:absolute;left:0;right:0;bottom:0;pointer-events:none;
  padding-bottom:16px;padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:620px;margin-inline:auto;
}
.dock .row{pointer-events:none}
.dock button,.dock input,.dock .sheet{pointer-events:auto}
.row{display:flex;gap:10px;align-items:stretch}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--fg)}
.play{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;cursor:pointer;font:inherit;text-align:left;border-radius:999px}
.play .ic{width:42px;height:42px;border-radius:50%;background:var(--fg);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.play .ic svg{width:16px;height:16px}
.play .tx{min-width:0;display:flex;flex-direction:column}
.play .t1{font-size:15px;font-weight:500}
.play .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play[aria-pressed="true"] .ic{background:var(--accent)}
.more{border-radius:999px;padding:0 16px;font:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.more svg{width:16px;height:16px;transition:transform .25s}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.sheet[hidden]{display:none}
.sheet{border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.lbl output{color:var(--fg);letter-spacing:.02em;text-transform:none;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;color:var(--fg);background:transparent;border:1px solid var(--edge);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 0}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin:0}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 6px);font-family:var(--f-display);font-style:italic;font-size:16px;white-space:nowrap;padding:6px 14px;border-radius:999px;pointer-events:none;transition:opacity .8s}
.hint.gone{opacity:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.more svg,.hint,.toast{transition:none}}
</style>

<div class="app" id="app">
  <canvas id="scene" aria-label="Река Чусовая с воды: небо, камень, лес, вода и звери в реальном времени"></canvas>
  <div class="scrim-top"></div>
  <div class="hud">
    <div>
      <div class="place">Чусовая · с воды</div>
      <div class="clock" id="clock">—:—</div>
      <div class="sub" id="sub"></div>
      <div class="holiday" id="holiday" hidden></div>
    </div>
    <div class="badge live" id="badge">сейчас</div>
  </div>
  <div class="toast" id="toast" aria-live="polite"></div>
  <div class="dock" id="dock">
    <div class="sheet glass" id="sheet" hidden>
      <div>
        <div class="lbl"><span>Пора</span><output id="seasonOut">по календарю</output></div>
        <div class="chips" id="seasons" role="group" aria-label="Пора года" style="margin-top:8px"></div>
      </div>
      <div>
        <div class="lbl"><label for="tod">Время</label><output id="todOut">—</output></div>
        <input id="tod" type="range" min="0" max="1439" step="1" value="720">
      </div>
      <div class="row" style="justify-content:space-between;align-items:center">
        <button class="chip" id="nowBtn" type="button">Вернуть «сейчас»</button>
        <span class="note" id="sunNote"></span>
      </div>
    </div>
    <div class="row" style="position:relative">
      <div class="hint glass" id="hint">Коснись воды, леса, камня или неба</div>
      <button class="play glass" id="play" type="button" aria-pressed="false">
        <span class="ic"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="playPath" d="M4 2.5v11l9.5-5.5z" fill="currentColor"/></svg></span>
        <span class="tx"><span class="t1" id="playT1">Включить звук</span><span class="t2" id="playT2">кантеле, бубен, флейта, река</span></span>
      </button>
      <button class="more glass" id="moreBtn" type="button" aria-expanded="false" aria-controls="sheet">
        Время и пора
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 10l4.5-4.5 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
/* ============ утилиты ============ */
var LAT=57.25,LON=59.35,TZ=5,RAD=Math.PI/180,DEG=180/Math.PI,TAU=Math.PI*2;
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function clamp(x,a,b){return x<a?a:x>b?b:x;}
function sstep(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function lerp(a,b,t){return a+(b-a)*t;}
function mix(c1,c2,t){return[lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];}
function mul(c,k){return[c[0]*k,c[1]*k,c[2]*k];}
function rgb(c,a){return "rgba("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+","+(a==null?1:a)+")";}
function hx(h){var n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function grey(c){var l=c[0]*.3+c[1]*.55+c[2]*.15;return[l*.97,l,l*1.05];}
function norm(x){x%=360;return x<0?x+360:x;}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(ix,iy){var h=(Math.imul(ix,374761393)+Math.imul(iy,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y){var ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);return lerp(lerp(hash2(ix,iy),hash2(ix+1,iy),ux),lerp(hash2(ix,iy+1),hash2(ix+1,iy+1),ux),uy);}
function n1(seed){var r=mulberry32(seed),p=[];for(var i=0;i<256;i++)p.push(r());return function(x){var i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(p[i&255],p[(i+1)&255],u);};}
function inR(d,a,b){return a<=b?(d>=a&&d<=b):(d>=a||d<=b);}

/* ============ астрономия ============ */
function dayNum(ms){return ms/864e5+2440587.5-2451545.0;}
function sunPos(d){var g=norm(357.529+0.98560028*d)*RAD,q=norm(280.459+0.98564736*d);var L=norm(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD,e=(23.439-0.00000036*d)*RAD;
  return{ra:Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L)),dec:Math.asin(Math.sin(e)*Math.sin(L)),lon:L*DEG};}
function moonPos(d){var L=norm(218.316+13.176396*d),M=norm(134.963+13.064993*d)*RAD,F=norm(93.272+13.229350*d)*RAD,D=norm(297.850+12.190749*d)*RAD,Ms=norm(357.529+0.98560028*d)*RAD;
  var lon=L+6.289*Math.sin(M)+1.274*Math.sin(2*D-M)+0.658*Math.sin(2*D)+0.214*Math.sin(2*M)-0.186*Math.sin(Ms)-0.114*Math.sin(2*F);
  var b=5.128*Math.sin(F)*RAD,e=23.439*RAD,l=lon*RAD;
  return{ra:Math.atan2(Math.sin(l)*Math.cos(e)-Math.tan(b)*Math.sin(e),Math.cos(l)),dec:Math.asin(Math.sin(b)*Math.cos(e)+Math.cos(b)*Math.sin(e)*Math.sin(l)),lon:norm(lon)};}
function lstRad(d){return norm(280.46061837+360.98564736629*d+LON)*RAD;}
var sinP=Math.sin(LAT*RAD),cosP=Math.cos(LAT*RAD);
function horiz(ra,dec,lst){var H=lst-ra,cH=Math.cos(H);return{alt:Math.asin(sinP*Math.sin(dec)+cosP*Math.cos(dec)*cH)*DEG,A:Math.atan2(Math.sin(H),cH*sinP-Math.tan(dec)*cosP)*DEG};}
function compute(ms){var d=dayNum(ms),lst=lstRad(d),s=sunPos(d),m=moonPos(d),sh=horiz(s.ra,s.dec,lst),mh=horiz(m.ra,m.dec,lst);mh.alt-=0.95*Math.cos(mh.alt*RAD);
  var el=norm(m.lon-s.lon);return{lst:lst,sun:sh,moon:mh,illum:(1-Math.cos(el*RAD))/2};}

/* ============ время, сезон, праздники ============ */
var MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function local(ms){return new Date(ms+TZ*36e5);}
function hm(ms){var t=local(ms);return("0"+t.getUTCHours()).slice(-2)+":"+("0"+t.getUTCMinutes()).slice(-2);}
function hourOf(ms){var t=local(ms);return t.getUTCHours()+t.getUTCMinutes()/60;}
function doyOf(ms){var t=local(ms);return Math.floor((Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate())-Date.UTC(t.getUTCFullYear(),0,1))/864e5)+1;}
function dayIndex(ms){return Math.floor((ms+TZ*36e5)/864e5);}
function season(doy){return{
  snow:Math.max(1-sstep(100,114,doy),sstep(289,298,doy)),
  ice:Math.max(1-sstep(108,120,doy),sstep(322,335,doy)),
  floes:sstep(106,110,doy)*(1-sstep(120,125,doy)),
  green:sstep(132,152,doy)*(1-sstep(240,262,doy)),
  birchGold:sstep(236,250,doy)*(1-sstep(276,290,doy)),
  larchGold:sstep(246,260,doy)*(1-sstep(288,302,doy)),
  larchGreen:sstep(128,148,doy)*(1-sstep(246,262,doy)),
  spring:sstep(110,125,doy)*(1-sstep(140,155,doy)),
  crickets:sstep(165,180,doy)*(1-sstep(228,242,doy)),
  doy:doy};}
function seasonText(s){
  if(s.floes>.5)return "ледоход";
  if(s.ice>.5&&s.snow>.5)return "зима, река подо льдом";
  if(s.snow>.5&&s.doy>200)return "первый снег, вода ещё тёмная";
  if(s.snow>.5)return "весна, по берегам снег";
  if(s.larchGold>.5)return "лиственницы золотые";
  if(s.birchGold>.5)return "берёзы желтеют";
  if(s.green>.5)return "лето, лес в полной силе";
  if(s.doy<170)return "весна, лес просыпается";
  return "лист облетел, ждём снега";}
function phaseOf(sa,A){if(sa<-9)return "night";if(sa<4)return A<0?"dawn":"dusk";return "day";}
var PHASE_RU={night:"ночь",dawn:"рассвет",day:"день",dusk:"сумерки"};
function easterOrth(y){var a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,m=Math.floor((d+e+114)/31),day=((d+e+114)%31)+1;return Date.UTC(y,m-1,day)+13*864e5;}
var HOL_RU={newyear:"Новый год",maslenitsa:"Масленица",march8:"8 Марта",cosmos:"День космонавтики",kupala:"Иван Купала",fisher:"День рыбака",tourist:"День туриста",epiphany:"Крещение"};
function holidayOf(ms){var t=local(ms),y=t.getUTCFullYear(),m=t.getUTCMonth()+1,d=t.getUTCDate(),dayMs=Date.UTC(y,m-1,d);
  if((m===12&&d>=25)||(m===1&&d<=14))return "newyear";
  if(m===1&&d===19)return "epiphany";
  var E=easterOrth(y);if(dayMs>=E-55*864e5&&dayMs<=E-49*864e5)return "maslenitsa";
  if(m===3&&d===8)return "march8";
  if(m===4&&d===12)return "cosmos";
  if(m===7&&(d===6||d===7))return "kupala";
  if(m===7){var f=new Date(Date.UTC(y,6,1)).getUTCDay(),firstSun=1+((7-f)%7);if(d===firstSun+7)return "fisher";}
  if(m===9&&d===27)return "tourist";
  return null;}
function isMaslenitsaSunday(ms){var t=local(ms),y=t.getUTCFullYear(),dayMs=Date.UTC(y,t.getUTCMonth(),t.getUTCDate());return dayMs===easterOrth(y)-49*864e5;}

/* ============ палитры в духе Alto ============ */
var PK=["top","mid","hor","glow","fog","far","near","shadow","stone","cloudLit","cloudShade","water"];
var PAL=[
 [-90,["#0a1232","#14264e","#26456e","#7d9ad0","#26446a","#203a5e","#10213c","#070d1c","#4a5c80","#34486e","#141f3c","#0b162c"]],
 [-12,["#131a46","#2a2f66","#544a88","#a07ab4","#4a4a80","#3a3e70","#1c224a","#0b1028","#6a6a96","#5a5288","#26284e","#141a3c"]],
 [-5,["#232a60","#5a4482","#c2707e","#f29470","#8c6c90","#4e4c80","#1c2040","#0c0e22","#7c7090","#e09c8a","#4c3e6a","#1a1e3c"]],
 [0,["#33467e","#9a6888","#eaa274","#ffd08c","#c6948e","#6a6a92","#232a3e","#111526","#a8908a","#f6c79c","#7c6280","#232a44"]],
 [6,["#3a6496","#7d9cbc","#e8cfae","#fbe9c6","#cfc8c0","#5c7294","#1f3329","#0e1a15","#bdb1a2","#f4ead8","#9c97a8","#1f3540"]],
 [20,["#3a6a9a","#7aa0c0","#bccbd4","#f4f6f4","#b4c0c6","#56739a","#1c3226","#0c1813","#b8b4aa","#eef0ee","#98a6b4","#1d3540"]],
 [70,["#346698","#749cbe","#b4c6d0","#f4f6f4","#aebcc4","#52709a","#1c3226","#0c1813","#bab6ac","#eef0ee","#94a4b4","#1d3540"]]
].map(function(k){var o={};PK.forEach(function(n,i){o[n]=hx(k[1][i]);});return[k[0],o];});
function palette(sa,cover){
  var P={};for(var i=1;i<PAL.length;i++){if(sa<=PAL[i][0]||i===PAL.length-1){var a=PAL[i-1],b=PAL[i],t=clamp((sa-a[0])/(b[0]-a[0]),0,1);PK.forEach(function(n){P[n]=mix(a[1][n],b[1][n],t);});break;}}
  if(cover>.3){var k=(cover-.3)/.7*.55;PK.forEach(function(n){P[n]=mix(P[n],grey(P[n]),k);});P.top=mix(P.top,P.mid,k*.6);}
  return P;}
function lc(P,d){return mix(mix(P.near,P.far,Math.min(1,d*1.05)),P.fog,Math.pow(d,1.6)*.28);}

/* ============ геометрия ============ */
var cv=document.getElementById("scene"),ctx=cv.getContext("2d");
var up=document.createElement("canvas"),uctx=up.getContext("2d");
var cBack=document.createElement("canvas"),cMid=document.createElement("canvas"),cFront=document.createElement("canvas");
var hitCv=document.createElement("canvas"),hctx=hitCv.getContext("2d",{willReadFrequently:true});
var auroraStrip=document.createElement("canvas");
var W=0,H=0,dpr=1,B=0,HZ=0,PPD=1,portrait=true,G=null,mask=null,MS=4;

function buildGeometry(){
  var r=mulberry32(5791),s=H/800,nA=n1(11),nB=n1(23);
  portrait=H>W*1.05;B=H*(portrait?.705:.72);HZ=B-H*.1;PPD=HZ/(portrait?58:44);
  var g={s:s};
  function ridge(base,amp,f,k,teeth){var p=new Path2D(),top=[];p.moveTo(-2,B+2);
    for(var x=0;x<=W+4;x+=2){var y=base-amp*(nA(x*f+k)*.75+nB(x*f*2.6+k)*.25);if(teeth)y-=teeth*Math.pow(Math.abs(Math.sin(x/(teeth*1.1))),.55)*(.6+.4*vnoise(x*.2,k));p.lineTo(x,y);top.push(y);}
    p.lineTo(W+4,B+2);p.closePath();return{path:p,top:top,base:base,amp:amp};}
  var rm=mulberry32(4242);g.mounts=[];
  [[.27,.03,.05,.22],[.245,.02,.035,.3],[.215,.012,.022,.42]].forEach(function(cfg,mi){var peaks=[];for(var pk=0;pk<5;pk++)peaks.push({x:rm()*W*1.2-W*.1,w:W*(.18+rm()*.25),h:H*(cfg[1]+rm()*(cfg[2]-cfg[1]))});
    var mp=new Path2D(),mtop=H;mp.moveTo(-2,B+2);for(var mx=0;mx<=W+4;mx+=3){var my=B-H*cfg[0]-H*.006*Math.sin(mx*.005+mi*2),pm=0;peaks.forEach(function(p){var u=(mx-p.x)/p.w,v=p.h*Math.exp(-u*u);if(v>pm)pm=v;});my-=pm;mp.lineTo(mx,my);if(my<mtop)mtop=my;}
    mp.lineTo(W+4,B+2);mp.closePath();g.mounts.push({path:mp,top:mtop,k:cfg[3]});});
  g.L0=ridge(B-H*.105,H*.05,.0028,3,2.5*s);
